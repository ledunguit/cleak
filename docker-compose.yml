# Analyzer stack for leak-inspector-tui.
# The TUI drives these two analyzers directly over MCP/HTTP (static :50061,
# dynamic :50062). There is no control-plane / web UI / database — the TUI is a
# standalone scanner that writes its report artifacts to disk.
#
# Each container reads ITS OWN env from apps/<svc>/.env via `env_file` (marked
# required:false so a fresh clone with no .env still boots on the code defaults —
# every var is optional). Copy apps/<svc>/.env.example → apps/<svc>/.env to override.
# NOTE: `env_file` requires Docker Compose v2.24+ for the `required:` field; on
# older Compose either upgrade or `cp` the .env files before `up`.
#
# ── SECURITY MODEL (see docs/SECURITY.md) ─────────────────────────────────────
# These are UNAUTHENTICATED MCP/HTTP services that execute untrusted C/C++ build
# code. They are published on 127.0.0.1 ONLY (never 0.0.0.0) so the LAN cannot
# reach them. There is deliberately NO auth layer on the MCP transport itself
# (out of scope — MCP has no standard auth here); if these ports must ever be
# reachable beyond localhost, front them with a reverse proxy that adds
# mutual-TLS / bearer auth and restrict by source IP. Hardening applied:
#   - no `privileged: true`, no docker.sock mounts (scan-build and the analyzers
#     run DIRECTLY inside their own container)
#   - `pids_limit` + `deploy.resources.limits` pin each service against
#     pid/fork-bombs and runaway memory (caps are runaway bounds calibrated to
#     this host's ~8GB Docker VM — raise per-host if large-corpus runs OOM; a
#     cap that is TOO LOW crash-loops the container, see static-analyzer comment)
#   - `security_opt: no-new-privileges` blocks setuid escalation inside the app
#   - `init: true` reaps zombies so pids_limit is not exhausted by leaked children
#   - static-analyzer gets its project mounts READ-ONLY (it only reads sources;
#     scan-build writes reports under RUNS_DIR, not into the scanned tree)
services:
  static-analyzer:
    build:
      context: .
      dockerfile: apps/static-analyzer/Dockerfile
    # Bound to localhost only: this is an internal, UNAUTHENTICATED MCP service
    # the TUI reaches over the docker network. Publishing to 0.0.0.0 would expose
    # untrusted-code execution to the LAN. Keep this port in sync with MCP_HTTP_PORT
    # in apps/static-analyzer/.env (defaults to 50061).
    ports:
      - "127.0.0.1:50061:50061"
    # MCP_HTTP_PORT + EXTRA_ALLOCATOR_NAMES now live in apps/static-analyzer/.env.
    env_file:
      - path: apps/static-analyzer/.env
        required: false
    environment:
      # Explicit worker-pool size (rather than the `os.cpus() - 1` default).
      # A real load test (19-case MemHint corpus, including large repos —
      # freerdp/vim/openssl) found the ACTUAL constraint on this host isn't
      # CPU, it's memory: each worker thread holds full tree-sitter ASTs for
      # whatever it's parsing, and with `discoveryConcurrency` also feeding
      # several files per case into the pool at once, 5 threads was enough to
      # OOM-kill the container even with NO `deploy.resources.limits` set (the
      # Docker Desktop VM's own ~8GB ceiling was hit — confirmed via
      # `docker events` showing `container oom`). Lowered to 2, which held up
      # under the same load test with 3 concurrent large-repo cases running.
      # Tune per-host: this reflects THIS host's ~8GB Docker VM allocation,
      # not a profiled memory-per-thread constant — a host with more RAM can
      # likely afford more threads.
      STATIC_PARSER_WORKERS: 2
    volumes:
      # Static analysis only READS the scanned sources (indexing, AST, scan-build
      # writes its report under RUNS_DIR). Mount read-only so a compromised
      # static-analyzer cannot tamper with the corpus on the host.
      - ./demo:/workspace/demo:ro
      - ./targets:/workspace/targets:ro
    networks:
      - mcpvul-net
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "2"
          # Runaway cap, not a tight budget: this host's whole Docker VM is ~8GB
          # and the 2-worker pool (see STATIC_PARSER_WORKERS) held up under the
          # load test — 4g only trips when something is actually out of control.
          memory: 4g
          pids: 256

  dynamic-analyzer:
    build:
      context: .
      dockerfile: apps/dynamic-analyzer/Dockerfile
    # Localhost-only (see static-analyzer note): internal, unauthenticated service.
    # Keep this in sync with MCP_HTTP_PORT in apps/dynamic-analyzer/.env (default 50062).
    ports:
      - "127.0.0.1:50062:50062"
    env_file:
      - path: apps/dynamic-analyzer/.env
        required: false
    environment:
      # Container artifact dir = the `runs:` volume mount. This is a deployment
      # fact (must differ from the host ./runs default in the app .env), so it
      # stays here and intentionally overrides RUNS_DIR from env_file.
      RUNS_DIR: /runs
      # See static-analyzer's comment above — the earlier OOM crash-loop was a
      # cap set TOO LOW, so these are runaway bounds, not tight budgets.
      DYNAMIC_MAX_CONCURRENT_RUNS: 3
    volumes:
      # Dynamic analysis BUILDS the scanned project (writes object files into
      # the tree) and runs the result, so these mounts must stay read-write —
      # unlike static-analyzer's read-only mounts above.
      - runs:/runs
      - ./demo:/workspace/demo
      - ./targets:/workspace/targets
      # ccache's object cache — persists across container recreates (`docker
      # compose up` doesn't wipe named volumes), so a rebuild of the SAME
      # project/commit (common on a corpus like LAMeD: 41 cases, 7 distinct
      # repos) hits the cache even after `docker compose build`.
      - ccache-data:/ccache
    networks:
      - mcpvul-net
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "4"
          # Builds + up to 3 concurrent sanitizer runs are the heavy consumers;
          # valgrind of a large binary can balloon, so keep this generous.
          memory: 4g
          pids: 512

volumes:
  runs:
  ccache-data:

networks:
  mcpvul-net:
    driver: bridge
